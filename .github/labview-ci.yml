# .github/labview-ci.yml - LabVIEW CI configuration
# Updated by the Reconfigure workflow.
schemaVersion: 1
installedVersion: 4.16.3
configuredAt: 2026-10-21T10:07:58Z
source:
  repo: elijah286/LabVIEW-CI-with-Containers
  ref: v4.16.3
config:
  labviewVersion: "2026"
  os: [windows, linux]
  concurrency:
    maxParallel: 5
  container:
    use: latest
    vipc:
      - path: ".github/labview/vipm/ci-tooling.vipc"
        monitor: true
      - path: "DQMH_Example/Dependencies.vipc"
        monitor: true
      - path: "DQMH_Example/DQMH_Example.dragon"
        monitor: true
      - path: "DQMH_Example/DQMH_Example.dragon"
        monitor: true
    dragon:
      - path: "DQMH_Example/DQMH_Example.dragon"
        monitor: true
  builds:
    runAll: false
    specs:
      - "DQMH_Example/DQMH_Example.lvproj::CML::windows"
activities:
  - dashboard
  - masscompile
  - vidiff
  - snapshots
  - custom-image
  - snapshots-2
  - unit-tests
  - builds
  - sbom-generation
  - vi-analyzer

unitTests:
  thresholds:
    passedPercent:
      greenAtLeast: 100
      yellowAtLeast: 80
      redBelow: 80
  tools:
    caraya:
      enabled: true
      locations:
        - "DQMH_Example/Unit Tests"
    lunit:
      enabled: false
      locations: []
    vi-tester:
      enabled: false
      locations: []
    utf:
      enabled: false
      locations: []
